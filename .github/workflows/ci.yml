name: Test
on:
  push:
    branches:
      - 'master'
    tags: ['*']
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
        include:
          - os: windows-latest
            version: '1'
          - os: macOS-latest
            version: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          plugins: noop
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  trim:
    name: Trimmed executable (juliac --trim=safe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Install JuliaC
        # `Pkg.Apps.add` does not install the General registry on demand the way
        # `Pkg.add` does, and a fresh runner has none yet.
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Apps.add("JuliaC")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Build and compare the trimmed filter app
        run: |
          julia --project=test/trim -e 'using Pkg; Pkg.instantiate()'
          julia --project=test/trim test/trim/check.jl
